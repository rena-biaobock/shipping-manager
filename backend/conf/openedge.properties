# PASOE application configuration
# Copy to openedge.properties and set real values before running.

# App
psc.as.appdir=shipping_manager
psc.as.oe.url=http://localhost:8080

# Database connection
psc.as.db.1=-db /data/shipping_manager -H localhost -S 8090
psc.as.db.connect.wait=30

# CORS — comma-separated allowed origins (never use wildcard in production)
shipping.cors.allowed-origins=http://localhost,http://localhost:4200

# JWT
shipping.jwt.secret=changeme
shipping.jwt.expire-minutes=60

# Pagination
shipping.page.default-size=25
shipping.page.max-size=100

# Idle watchdog threshold (days without a scan)
shipping.idle.threshold-days=30

# Report output directory
shipping.report.dir=/reports
