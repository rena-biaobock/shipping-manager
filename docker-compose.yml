services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      OE_CORS_ORIGINS: "http://localhost"
      OE_JWT_SECRET: "changeme"
      OE_DB_PATH: "/data/shipping_manager"
      OE_IDLE_THRESHOLD_DAYS: "30"
    volumes:
      - oe_data:/data
      - reports:/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/web/api/v1/stock-labels"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: "/web/api/v1"
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  oe_data:
  reports:
