services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGINS: "http://localhost"
      XLSX_PATH: "/data/stock.xlsx"
      PORT: "8080"
    volumes:
      - ./stock.xlsx:/data/stock.xlsx:ro

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: "/web/api/v1"
    ports:
      - "80:80"
    depends_on:
      - backend
