services:
  # Node.js / Express mock of the Progress OpenEdge PASOE backend.
  # Swap build context to ./backend once a licensed openedge:12.7 image is available.
  backend:
    build: ./backend-mock
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGINS: "http://localhost"
      PORT: "8080"
    volumes:
      - ./stock.xlsx:/data/stock.xlsx:ro

  frontend:
    build:
      context: ./frontend
      args:
        API_BASE_URL: "/web/api/v1"
    ports:
      - "80:80"
    depends_on:
      - backend
